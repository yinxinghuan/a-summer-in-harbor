<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海湾居民 · 本地预览</title><script src="../alteru-storage-scope.js" data-game-storage-id="e78df027-7ef4-4d49-82eb-ea91f03d9fb3"></script><style>body{font:18px/1.6 system-ui;background:#fff7df;color:#214d4b;max-width:760px;margin:24px auto;padding:20px}button,select{font:inherit;padding:14px;margin:6px;border:2px solid #537268;background:#edf2df;color:inherit;cursor:pointer}p{max-width:65ch}</style><h1>海湾居民 · 本地预览</h1><p>仅用于本机审阅。下面的入口使用合成进度；人物沿用旧角色外观，自由对话返回测试回复，不是正式在线模型。不会读取正式玩家存档。</p><label>语言 <select id="locale"><option value="zh">中文</option><option value="en">English</option></select></label><div id="cases"></div><p id="status" role="status"></p><script type="module">
const cases={'schedule-learning':'日程 · 主动询问后记入手记','schedule-known':'日程 · 临近换地点与未解锁码头','schedule-hidden':'日程 · 未聊过时不显示','opening':'从开场开始','morning':'上午 · 旧街 / Samira','afternoon':'午后 · 旧街 / Avery + Dani','evening':'傍晚 · 码头相聚（已邀请）','night':'夜间 · 新居民退场','owen':'上午 · 港口 / Owen','dani':'上午 · 花园 / Dani','fern':'花园 · 浇水与成长','mara-life':'车站街 · 原居民生活追问','legacy-overlap':'旧存档重叠兼容'};
for(const [name,label] of Object.entries(cases)){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{const locale=document.querySelector('#locale').value;const r=await fetch('/qa/prepare?case='+name+'&locale='+locale,{method:'POST'});if(!r.ok)throw Error(await r.text());const s=await r.json();alteruLocalStorage.setItem('harbor-locale',locale);alteruLocalStorage.setItem('harbor-muted','1');if(name!=='opening')alteruLocalStorage.setItem('harbor-opening:'+s.id,'3');location.href='/?debug=1'}catch(e){document.querySelector('#status').textContent=String(e);b.disabled=false}};document.querySelector('#cases').append(b)}
</script></html>
